<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tech Help Dashboard</title>
  <style>
    body { font-family: Arial, Helvetica, sans-serif; margin: 0; padding: 24px; background: #f8f9fa; color: #202124; }
    h1 { font-size: 32px; margin: 0 0 4px; }
    .meta { color: #5f6368; margin-bottom: 16px; font-size: 16px; }
    #meta-time { font-weight: bold; }
    table { width: 100%; border-collapse: collapse; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
    th, td { text-align: left; padding: 14px 16px; border-bottom: 1px solid #eee; font-size: 20px; }
    th { background: #f1f3f4; position: sticky; top: 0; font-size: 17px; }
    tr.assigned { background: #fef7e0; }
    tr.not-arrived { background: #f1f3f4; color: #80868b; }
    .pill { display: inline-block; padding: 5px 14px; border-radius: 14px; font-size: 17px; font-weight: bold; white-space: nowrap; }
    .pill.not-assigned { background: #fce8e6; color: #c5221f; }
    .pill.assigned { background: #fef7e0; color: #b06000; }
    .pill.member-yes { background: #e6f4ea; color: #188038; }
    .pill.member-no { background: #eee; color: #5f6368; }
    .pill.not-arrived { background: #e8eaed; color: #5f6368; }
    .actions { display: flex; align-items: center; gap: 10px; white-space: nowrap; }
    button.claim {
      padding: 10px 22px; font-size: 17px; font-weight: bold; border-radius: 6px; border: none;
      background: #1a73e8; color: #fff; cursor: pointer;
    }
    button.claim:disabled { background: #dadce0; color: #80868b; cursor: not-allowed; }
    button.complete {
      padding: 10px 22px; font-size: 17px; font-weight: bold; border-radius: 6px; border: none;
      background: #188038; color: #fff; cursor: pointer;
    }
    .unclaim-link { font-size: 15px; color: #5f6368; text-decoration: underline; cursor: pointer; background: none; border: none; padding: 0; }
    .empty { padding: 40px; text-align: center; color: #5f6368; font-size: 20px; }
    .conn-warning { display: none; background: #fce8e6; color: #c5221f; padding: 10px 14px; border-radius: 6px; margin-bottom: 12px; font-size: 16px; font-weight: bold; }
    #open-count { font-weight: bold; color: #c5221f; }
    tr.divider td { background: #f1f3f4; color: #5f6368; font-weight: bold; font-size: 15px; padding: 8px 16px; border-bottom: 1px solid #eee; }
    .topbar { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
    #not-here-count { color: #5f6368; }
    #compactBtn {
      padding: 8px 16px; font-size: 15px; border-radius: 6px; border: 1px solid #dadce0;
      background: #fff; color: #3c4043; cursor: pointer; white-space: nowrap;
    }
    body.compact { padding: 12px; }
    body.compact h1 { font-size: 24px; }
    body.compact .meta { font-size: 14px; margin-bottom: 8px; }
    body.compact th, body.compact td { padding: 4px 10px; font-size: 14px; }
    body.compact th { font-size: 13px; }
    body.compact td:first-child { white-space: nowrap; }
    body.compact .pill { padding: 2px 9px; font-size: 13px; }
    body.compact button.claim, body.compact button.complete { padding: 4px 14px; font-size: 14px; }
    body.compact .unclaim-link { font-size: 13px; }
    body.compact tr.divider td { padding: 3px 10px; font-size: 13px; }
  </style>
</head>
<body>
  <div class="topbar">
    <div>
      <h1>Tech Help Queue</h1>
      <div class="meta">Auto-refreshes every 4 seconds &middot; <span id="open-count"></span><span id="not-here-count"></span> &middot; Last updated: <span id="meta-time">--</span></div>
    </div>
    <button id="compactBtn" type="button">Compact view</button>
  </div>
  <div class="conn-warning" id="connWarning">Can't reach the server - showing the last known queue. Retrying...</div>

  <table>
    <thead>
      <tr>
        <th>Time</th>
        <th>Name</th>
        <th>Member</th>
        <th>Device</th>
        <th>Problem</th>
        <th>Checked In</th>
        <th>Status</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  <div class="empty" id="emptyMsg" style="display:none;">No open requests right now.</div>

  <script>
    const REFRESH_MS = 4000;

    function fmtTime(iso) {
      try {
        return new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      } catch (e) { return iso; }
    }

    function escapeHtml(s) {
      return String(s || '').replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    function rowHtml(r) {
      const isAssigned = r.status === 'Assigned';
      const notArrived = r.checkedIn !== 'Yes';
      const statusPill = isAssigned
        ? '<span class="pill assigned">Assigned</span>'
        : '<span class="pill not-assigned">Not Assigned</span>';
      const memberPill = r.member === 'Yes'
        ? '<span class="pill member-yes">Member</span>'
        : '<span class="pill member-no">Not Found</span>';
      const checkedInPill = notArrived
        ? '<span class="pill not-arrived">Not yet here</span>'
        : '<span class="pill member-yes">Checked in</span>';

      let actions = '';
      if (!isAssigned) {
        actions = notArrived
          ? '<button class="claim" disabled title="Check in at the front desk first">Claim</button>'
          : '<button class="claim" onclick="claim(' + r.row + ')">Claim</button>';
      } else {
        actions = '<div class="actions">' +
                     '<button class="complete" onclick="complete(' + r.row + ')">Done</button>' +
                     '<button class="unclaim-link" onclick="unclaim(' + r.row + ')">Unclaim</button>' +
                   '</div>';
      }

      return '<tr class="' + (isAssigned ? 'assigned' : (notArrived ? 'not-arrived' : '')) + '">' +
        '<td>' + fmtTime(r.timestamp) + '</td>' +
        '<td>' + escapeHtml(r.name) + '</td>' +
        '<td>' + memberPill + '</td>' +
        '<td>' + escapeHtml(r.device) + '</td>' +
        '<td>' + escapeHtml(r.problem) + '</td>' +
        '<td>' + checkedInPill + '</td>' +
        '<td>' + statusPill + '</td>' +
        '<td>' + actions + '</td>' +
      '</tr>';
    }

    function render(requests) {
      const tbody = document.getElementById('rows');
      const emptyMsg = document.getElementById('emptyMsg');
      document.getElementById('meta-time').textContent = new Date().toLocaleTimeString();

      // Three groups, in the order the room cares about: people who are here
      // and waiting, pre-registered people who haven't arrived yet (about to
      // become waiting), and people already being helped.
      const waiting = requests.filter(function (r) { return r.status !== 'Assigned' && r.checkedIn === 'Yes'; });
      const assigned = requests.filter(function (r) { return r.status === 'Assigned'; });
      const notHere = requests.filter(function (r) { return r.status !== 'Assigned' && r.checkedIn !== 'Yes'; });
      document.getElementById('open-count').textContent = waiting.length + ' waiting';
      document.getElementById('not-here-count').textContent = notHere.length ? ' · ' + notHere.length + ' not yet here' : '';

      if (!requests.length) {
        tbody.innerHTML = '';
        emptyMsg.style.display = 'block';
        return;
      }
      emptyMsg.style.display = 'none';

      let html = waiting.map(rowHtml).join('');
      if (notHere.length) {
        html += '<tr class="divider"><td colspan="8">Not yet here &mdash; ' + notHere.length + '</td></tr>';
        html += notHere.map(rowHtml).join('');
      }
      if (assigned.length) {
        html += '<tr class="divider"><td colspan="8">Claimed &mdash; ' + assigned.length + '</td></tr>';
        html += assigned.map(rowHtml).join('');
      }
      tbody.innerHTML = html;
    }

    async function refresh() {
      const warning = document.getElementById('connWarning');
      try {
        const resp = await fetch('/api/requests');
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        const data = await resp.json();
        warning.style.display = 'none';
        render(data);
      } catch (err) {
        warning.style.display = 'block';
        console.error('Refresh failed', err);
      }
    }

    async function claim(row) {
      await fetch('/api/claim', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ row })
      });
      refresh();
    }

    async function unclaim(row) {
      await fetch('/api/unclaim', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ row })
      });
      refresh();
    }

    async function complete(row) {
      await fetch('/api/complete', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ row })
      });
      refresh();
    }

    // Compact view: tighter padding/fonts so more rows fit on a projector.
    // Remembered per browser; the try/catch keeps the dashboard working if
    // storage is blocked.
    const COMPACT_KEY = 'techhelp-dashboard-compact';
    let compactOn = false;
    try { compactOn = localStorage.getItem(COMPACT_KEY) === '1'; } catch (e) {}

    function applyCompact() {
      document.body.classList.toggle('compact', compactOn);
      document.getElementById('compactBtn').textContent = compactOn ? 'Normal view' : 'Compact view';
    }

    document.getElementById('compactBtn').addEventListener('click', function () {
      compactOn = !compactOn;
      applyCompact();
      try { localStorage.setItem(COMPACT_KEY, compactOn ? '1' : '0'); } catch (e) {}
    });
    applyCompact();

    refresh();
    setInterval(refresh, REFRESH_MS);
  </script>
</body>
</html>
