<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tech Help Dashboard</title>
  <style>
    body { font-family: Arial, Helvetica, sans-serif; margin: 0; padding: 24px; background: #f8f9fa; color: #202124; }
    h1 { font-size: 24px; margin: 0 0 4px; }
    .meta { color: #5f6368; margin-bottom: 16px; font-size: 13px; }
    #meta-time { font-weight: bold; }
    table { width: 100%; border-collapse: collapse; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
    th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid #eee; font-size: 15px; }
    th { background: #f1f3f4; position: sticky; top: 0; }
    tr.assigned { background: #fef7e0; }
    tr.not-arrived { background: #f1f3f4; color: #80868b; }
    .pill { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; }
    .pill.not-assigned { background: #fce8e6; color: #c5221f; }
    .pill.assigned { background: #fef7e0; color: #b06000; }
    .pill.member-yes { background: #e6f4ea; color: #188038; }
    .pill.member-no { background: #eee; color: #5f6368; }
    .pill.not-arrived { background: #e8eaed; color: #5f6368; }
    button { padding: 7px 14px; font-size: 13px; border-radius: 6px; border: 1px solid #ccc; background: #fff; cursor: pointer; margin-right: 4px; }
    button.claim { background: #1a73e8; color: #fff; border-color: #1a73e8; }
    button.claim:disabled { background: #dadce0; border-color: #dadce0; color: #80868b; cursor: not-allowed; }
    button.complete { background: #188038; color: #fff; border-color: #188038; }
    button.unclaim { background: #fff; }
    .empty { padding: 40px; text-align: center; color: #5f6368; }
    .conn-warning { display: none; background: #fce8e6; color: #c5221f; padding: 10px 14px; border-radius: 6px; margin-bottom: 12px; font-size: 13px; font-weight: bold; }
  </style>
</head>
<body>
  <h1>Tech Help Queue</h1>
  <div class="meta">Auto-refreshes every 4 seconds &middot; Last updated: <span id="meta-time">--</span></div>
  <div class="conn-warning" id="connWarning">Can't reach the server - showing the last known queue. Retrying...</div>

  <table>
    <thead>
      <tr>
        <th>Time</th>
        <th>Name</th>
        <th>Member</th>
        <th>Device</th>
        <th>Problem</th>
        <th>Checked In</th>
        <th>Status</th>
        <th>Assigned To</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  <div class="empty" id="emptyMsg" style="display:none;">No open requests right now.</div>

  <script>
    const REFRESH_MS = 4000;

    function fmtTime(iso) {
      try {
        return new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      } catch (e) { return iso; }
    }

    function escapeHtml(s) {
      return String(s || '').replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    function render(requests) {
      const tbody = document.getElementById('rows');
      const emptyMsg = document.getElementById('emptyMsg');
      document.getElementById('meta-time').textContent = new Date().toLocaleTimeString();

      if (!requests.length) {
        tbody.innerHTML = '';
        emptyMsg.style.display = 'block';
        return;
      }
      emptyMsg.style.display = 'none';

      tbody.innerHTML = requests.map(function (r) {
        const isAssigned = r.status === 'Assigned';
        const notArrived = r.checkedIn !== 'Yes';
        const statusPill = isAssigned
          ? '<span class="pill assigned">Assigned</span>'
          : '<span class="pill not-assigned">Not Assigned</span>';
        const memberPill = r.member === 'Yes'
          ? '<span class="pill member-yes">Member</span>'
          : '<span class="pill member-no">Not Found</span>';
        const checkedInPill = notArrived
          ? '<span class="pill not-arrived">Not yet here</span>'
          : '<span class="pill member-yes">Checked in</span>';

        let actions = '';
        if (!isAssigned) {
          actions = notArrived
            ? '<button class="claim" disabled title="Check in at the front desk first">Claim</button>'
            : '<button class="claim" onclick="claim(' + r.row + ')">Claim</button>';
        } else {
          actions = '<button class="unclaim" onclick="unclaim(' + r.row + ')">Unclaim</button>' +
                     '<button class="complete" onclick="complete(' + r.row + ')">Done</button>';
        }

        return '<tr class="' + (isAssigned ? 'assigned' : (notArrived ? 'not-arrived' : '')) + '">' +
          '<td>' + fmtTime(r.timestamp) + '</td>' +
          '<td>' + escapeHtml(r.name) + '</td>' +
          '<td>' + memberPill + '</td>' +
          '<td>' + escapeHtml(r.device) + '</td>' +
          '<td>' + escapeHtml(r.problem) + '</td>' +
          '<td>' + checkedInPill + '</td>' +
          '<td>' + statusPill + '</td>' +
          '<td>' + escapeHtml(r.assignedTo || '') + '</td>' +
          '<td>' + actions + '</td>' +
        '</tr>';
      }).join('');
    }

    async function refresh() {
      const warning = document.getElementById('connWarning');
      try {
        const resp = await fetch('/api/requests');
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        const data = await resp.json();
        warning.style.display = 'none';
        render(data);
      } catch (err) {
        warning.style.display = 'block';
        console.error('Refresh failed', err);
      }
    }

    async function claim(row) {
      const helper = prompt('Your name (so members know who is helping):');
      if (!helper) return;
      await fetch('/api/claim', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ row, helperName: helper })
      });
      refresh();
    }

    async function unclaim(row) {
      await fetch('/api/unclaim', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ row })
      });
      refresh();
    }

    async function complete(row) {
      await fetch('/api/complete', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ row })
      });
      refresh();
    }

    refresh();
    setInterval(refresh, REFRESH_MS);
  </script>
</body>
</html>
