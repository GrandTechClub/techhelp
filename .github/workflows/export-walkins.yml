name: Export Tech Help walk-ins

on:
  # No schedule: trigger here on purpose. GitHub Actions' own cron
  # scheduling is "best effort" with no timing guarantee - it has fired
  # up to ~4.5 hours late, well after the same-night Windows/SQL load
  # steps already ran and found nothing to pick up. This is triggered
  # externally instead, by a Task Scheduler job on the club's own Windows
  # server (see trigger_export_walkins_workflow.py) calling the GitHub
  # API's workflow_dispatch endpoint at 5:05 PM Phoenix time every
  # Tuesday - that server's own schedules have been reliable all along,
  # unlike GitHub's.
  workflow_dispatch:
    inputs:
      test_only:
        description: 'Write the CSV as a downloadable artifact instead of emailing it'
        type: boolean
        default: false

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install googleapis --no-save
      - name: Run export
        run: |
          if [ "${{ inputs.test_only }}" = "true" ]; then
            node scripts/export-walkins.js --out TechHelp_Walkins.csv
          else
            node scripts/export-walkins.js
          fi
        env:
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
      - name: Upload CSV artifact
        if: ${{ inputs.test_only == true }}
        uses: actions/upload-artifact@v4
        with:
          name: TechHelp_Walkins
          path: TechHelp_Walkins.csv
