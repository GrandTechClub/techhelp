name: Export Tech Help walk-ins

on:
  schedule:
    # 5:00 PM Phoenix time on Tuesdays. Phoenix doesn't observe Daylight
    # Saving Time, so it stays UTC-7 year-round - 5pm Tuesday local is
    # midnight UTC on Wednesday, no seasonal adjustment needed.
    - cron: '0 0 * * 3'
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install googleapis --no-save
      - run: node scripts/export-walkins.js
        env:
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
