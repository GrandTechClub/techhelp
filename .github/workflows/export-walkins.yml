name: Export Tech Help walk-ins

on:
  schedule:
    # 5:05 PM Phoenix time on Tuesdays. Phoenix doesn't observe Daylight
    # Saving Time, so it stays UTC-7 year-round - 5:05pm Tuesday local is
    # 00:05 UTC on Wednesday, no seasonal adjustment needed. Scheduled 5
    # minutes off the exact hour on purpose - GitHub Actions' scheduled
    # triggers are prone to delay or being dropped entirely at peak load,
    # which is worst right on the hour.
    - cron: '5 0 * * 3'
  workflow_dispatch:
    inputs:
      test_only:
        description: 'Write the CSV as a downloadable artifact instead of emailing it'
        type: boolean
        default: false

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install googleapis --no-save
      - name: Run export
        run: |
          if [ "${{ inputs.test_only }}" = "true" ]; then
            node scripts/export-walkins.js --out TechHelp_Walkins.csv
          else
            node scripts/export-walkins.js
          fi
        env:
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
      - name: Upload CSV artifact
        if: ${{ inputs.test_only == true }}
        uses: actions/upload-artifact@v4
        with:
          name: TechHelp_Walkins
          path: TechHelp_Walkins.csv
