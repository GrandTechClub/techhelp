name: Import Club Express reports

on:
  schedule:
    # Three attempts packed into the window that actually matters: after
    # Club Express's own 11:30 AM export, before the noon-ish Tech Help
    # start. GitHub Actions' scheduled triggers are "best effort" with no
    # timing guarantee - they've fired hours late before - so one attempt
    # isn't reliable enough here, unlike the walk-ins export (which can
    # land whenever, so a single attempt plus a Windows-side repeating
    # pickup is enough for that one). This script is safe to run more
    # than once: Members does a full overlay each time, and
    # Pre-Registrations dedupes by CE Reg ID, so repeats before an email
    # exists just find nothing, and repeats after it exists just skip
    # what's already imported. Phoenix (Arizona) doesn't observe Daylight
    # Saving Time, so it stays UTC-7 year-round - no seasonal adjustment
    # needed here, unlike most US timezones.
    - cron: '35 18 * * 2'  # 11:35 AM Phoenix
    - cron: '45 18 * * 2'  # 11:45 AM Phoenix
    - cron: '55 18 * * 2'  # 11:55 AM Phoenix
  workflow_dispatch: {} # also lets you trigger it manually from the Actions tab

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install googleapis --no-save
      - run: node scripts/fetch-and-import.js
        env:
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          RENDER_BASE_URL: ${{ secrets.RENDER_BASE_URL }}
          RENDER_IMPORT_API_KEY: ${{ secrets.RENDER_IMPORT_API_KEY }}
