name: Import Club Express reports

on:
  # No schedule: trigger here on purpose. GitHub Actions' own cron
  # scheduling is "best effort" with no timing guarantee - it has fired
  # up to ~4 hours late more than once, well past the noon-ish Tech Help
  # start time. This is triggered externally instead, by a Task Scheduler
  # job on the club's own Windows server (see trigger_import_workflow.py)
  # calling the GitHub API's workflow_dispatch endpoint at 11:45 AM
  # Phoenix time every Tuesday - that server's own schedules have been
  # reliable all along, unlike GitHub's.
  workflow_dispatch: {} # also lets you trigger it manually from the Actions tab

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install googleapis --no-save
      - run: node scripts/fetch-and-import.js
        env:
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          RENDER_BASE_URL: ${{ secrets.RENDER_BASE_URL }}
          RENDER_IMPORT_API_KEY: ${{ secrets.RENDER_IMPORT_API_KEY }}
