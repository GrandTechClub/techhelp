name: Import Club Express reports

on:
  # No schedule: trigger here on purpose. GitHub Actions' own cron
  # scheduling is "best effort" with no timing guarantee - even three
  # attempts packed into the critical pre-event window (11:35/11:45/11:55
  # AM) failed to fire at all on 2026-09-22. This job is time-critical -
  # same-day registrations are invisible to check-in staff if it's
  # missed - so it's triggered externally instead, by a scheduled job on
  # cron-job.org calling this workflow's workflow_dispatch API endpoint
  # directly. That's a dedicated, purpose-built scheduling service, not
  # subject to either GitHub Actions' internal scheduler flakiness or the
  # HTTPS-call restrictions on the club's own Windows server that ruled
  # out triggering it from there instead.
  workflow_dispatch: {} # also lets you trigger it manually from the Actions tab

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install googleapis --no-save
      - run: node scripts/fetch-and-import.js
        env:
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          RENDER_BASE_URL: ${{ secrets.RENDER_BASE_URL }}
          RENDER_IMPORT_API_KEY: ${{ secrets.RENDER_IMPORT_API_KEY }}
