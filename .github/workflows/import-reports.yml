name: Import Club Express reports

on:
  schedule:
    # 12:00 PM (noon) Phoenix time on Tuesdays. Phoenix (Arizona) doesn't
    # observe Daylight Saving Time, so it stays UTC-7 year-round - no
    # seasonal adjustment needed here, unlike most US timezones.
    - cron: '0 19 * * 2'
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install googleapis --no-save
      - run: node scripts/fetch-and-import.js
        env:
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          RENDER_BASE_URL: ${{ secrets.RENDER_BASE_URL }}
          RENDER_IMPORT_API_KEY: ${{ secrets.RENDER_IMPORT_API_KEY }}
